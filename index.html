<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマート棚卸システム（スマホ入力 ＆ PC管理ダッシュボード）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1次元バーコード（JAN/EAN/CODE128）高速認識エンジン Quagga2 -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tap-btn {
            transition: transform 0.05s ease, background-color 0.1s ease;
        }
        .tap-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 9px rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.4s infinite;
        }
        @keyframes laserScan {
            0%, 100% { top: 20%; }
            50% { top: 80%; }
        }
        .laser-line {
            position: absolute;
            left: 16%;
            right: 16%;
            height: 2px;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444, 0 0 16px #f87171;
            animation: laserScan 1.4s infinite ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 最上部コンパクト共通ヘッダー（iPhone SEでも場所を取らない高さ） -->
    <header class="bg-slate-900 text-white px-2 py-1.5 flex items-center justify-between gap-1 sticky top-0 z-30 shadow">
        <div class="flex items-center gap-1">
            <!-- GAS URL接続設定ボタン（スマホ・PC共通でいつでも設定可能） -->
            <button onclick="openGasConfigModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[11px] px-1.5 py-1 rounded flex items-center gap-1 font-bold" title="GASスプレッドシート接続URL設定">
                <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <span>⚙️接続</span>
            </button>
            <!-- 作業担当者（最大15名）選択 -->
            <select id="worker-select" onchange="onWorkerChange(this.value)" class="bg-slate-800 border border-slate-600 text-amber-300 font-bold text-xs rounded px-1.5 py-1 outline-none max-w-[92px] sm:max-w-none">
            </select>
        </div>

        <div class="flex items-center gap-1">
            <button onclick="fetchAllFromGasApi(true)" class="bg-sky-700 hover:bg-sky-600 text-white font-bold text-[11px] px-1.5 py-1 rounded" title="スプレッドシートから最新データを同期">
                🔄同期
            </button>
            <button id="btn-sound" onclick="toggleSound()" class="bg-slate-800 border border-slate-700 text-[11px] px-1.5 py-1 rounded" title="電子音切替">
                🔊音
            </button>
            <button id="btn-tts" onclick="toggleTts()" class="bg-amber-600 text-white font-bold text-[11px] px-1.5 py-1 rounded" title="音声ガイド切替">
                🗣️声:ON
            </button>
            <button onclick="openBackupModal()" class="bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-[11px] px-1.5 py-1 rounded" title="バックアップとコード保存">
                💾保存
            </button>
            <button id="btn-mode-switch" onclick="requestAdminView()" class="bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white font-bold text-[11px] px-1.5 py-1 rounded">
                🔒管理
            </button>
        </div>
    </header>

    <!-- ========================================================== -->
    <!-- 1. スマホ現場入力ビュー（iPhone SE / Android ファーストビュー最適化） -->
    <!-- ========================================================== -->
    <main id="mobile-view" class="flex-1 max-w-md w-full mx-auto p-2 flex flex-col gap-1.5">

        <!-- ① 最上部：ロケーション切替 ＆ 全方向カメラスキャン・音声バー -->
        <div class="bg-white rounded-xl p-2 shadow-sm border border-slate-200 flex flex-col gap-1.5">
            <div class="grid grid-cols-3 gap-1 text-[11px]">
                <select id="m-sel-area" onchange="onMobileLocationFilter()" class="bg-slate-100 border border-slate-300 rounded px-1.5 py-1 font-bold text-slate-800 truncate"></select>
                <select id="m-sel-shelf" onchange="onMobileLocationFilter()" class="bg-slate-100 border border-slate-300 rounded px-1.5 py-1 font-bold text-slate-800 truncate"></select>
                <select id="m-sel-level" onchange="onMobileLocationFilter()" class="bg-slate-100 border border-slate-300 rounded px-1.5 py-1 font-bold text-slate-800 truncate"></select>
            </div>

            <!-- カメラ・JAN入力・音声読み上げ・ハンズフリーボタン -->
            <div class="flex gap-1">
                <button id="btn-cam-toggle" onclick="toggleCameraScanner()" class="tap-btn bg-emerald-600 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 shrink-0">
                    <span>📷</span><span id="cam-btn-label">カメラ</span>
                </button>
                <input id="barcode-input" type="text" inputmode="numeric" placeholder="JAN手入力"
                       onkeydown="if(event.key==='Enter') handleBarcodeScan(this.value)"
                       class="flex-1 min-w-0 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono">
                <button onclick="handleBarcodeScan(document.getElementById('barcode-input').value)" class="tap-btn bg-slate-800 text-white text-xs font-bold px-2 py-1.5 rounded-lg shrink-0">
                    読込
                </button>
                <button onclick="speakCurrentRecord(true)" class="tap-btn bg-amber-500 text-white text-xs font-bold px-2 py-1.5 rounded-lg shrink-0" title="今の商品を明るい声で読み上げ">
                    🗣️読上
                </button>
                <button id="btn-voice-toggle" onclick="toggleVoiceRecognition()" class="tap-btn bg-rose-600 text-white text-xs font-bold px-2 py-1.5 rounded-lg shrink-0" title="ハンズフリー音声認識（読み上げ中の声掛け割り込み対応）">
                    🎤<span id="voice-btn-label">音声</span>
                </button>
            </div>

            <!-- 音声ガイド＆認識ステータスモニター -->
            <div class="bg-slate-900 text-[11px] px-2.5 py-1 rounded-lg flex items-center justify-between gap-2 font-mono">
                <div class="truncate text-amber-300">
                    🗣️ <span id="tts-subtitle">「🗣️読上」または「🎤音声」で明るく音声ガイドします</span>
                </div>
                <span id="voice-status-dot" class="w-2 h-2 rounded-full bg-slate-500 shrink-0"></span>
            </div>
            <div id="voice-transcript-bar" class="hidden bg-rose-950 text-emerald-300 text-[11px] px-2.5 py-1 rounded-lg font-mono truncate">
                🎤 <span id="voice-transcript">聞き取り中（読み上げ途中でも「数字」「次へ」に反応します）</span>
            </div>

            <!-- 解析用非表示Canvas -->
            <canvas id="decode-canvas" class="hidden"></canvas>

            <!-- 全方向カメラプレビュー枠（サンプルと同一の縦横比補正・360°全方向対応） -->
            <div id="camera-wrapper" class="hidden relative w-full h-44 bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
                <canvas id="preview-canvas" class="w-full h-full block"></canvas>

                <!-- 左上：スキャンエンジン稼働モニター -->
                <div class="absolute top-1.5 left-1.5 bg-black/75 text-emerald-300 text-[10px] font-mono px-2 py-0.5 rounded z-10 pointer-events-none">
                    <span id="scan-debug-info">解析準備中...</span>
                </div>

                <!-- スキャン稼働中ガイド枠 -->
                <div id="scan-overlay" class="absolute inset-0 pointer-events-none">
                    <div class="absolute inset-x-[14%] inset-y-[12%] border-2 border-emerald-400/90 rounded-xl shadow-[0_0_0_9999px_rgba(0,0,0,0.40)]"></div>
                    <div class="laser-line"></div>
                    <div class="absolute inset-y-[16%] left-1/2 w-[1px] bg-emerald-400/40"></div>
                    <span class="absolute bottom-1.5 left-1/2 -translate-x-1/2 bg-black/80 text-emerald-300 text-[10px] px-2.5 py-0.5 rounded-full whitespace-nowrap">
                        🔍 縦・横・斜め どの向きでも緑枠に入れれば即反応
                    </span>
                </div>

                <!-- 読取後の一時停止オーバーレイ -->
                <div id="scan-paused-overlay" class="hidden absolute inset-0 bg-slate-950/75 flex flex-col items-center justify-center p-2 text-center z-20">
                    <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-0.5 rounded-full mb-1">
                        ⏸ バーコード読取完了
                    </span>
                    <p class="text-white text-[11px] mb-1.5">数量を入力して「確定して次へ」で次の読取を再開します</p>
                    <button onclick="resumeCameraScan()" class="tap-btn bg-slate-700 text-white border border-slate-400 px-3 py-1 rounded-lg text-xs font-bold">
                        🔄 別の商品を再スキャン
                    </button>
                </div>

                <!-- デジタルズーム切替（初期1.6x） -->
                <div class="absolute top-1.5 right-1.5 flex gap-1 z-10">
                    <button onclick="setDigitalZoom(1.0)" id="z-btn-10" class="bg-slate-900/85 text-white border border-slate-600 text-[10px] font-bold px-2 py-0.5 rounded">1.0x</button>
                    <button onclick="setDigitalZoom(1.6)" id="z-btn-16" class="bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">1.6x</button>
                    <button onclick="setDigitalZoom(2.2)" id="z-btn-22" class="bg-slate-900/85 text-white border border-slate-600 text-[10px] font-bold px-2 py-0.5 rounded">2.2x</button>
                </div>
            </div>
        </div>

        <!-- ② 上部：商品名・単位・今回数量（最優先表示） -->
        <div class="bg-slate-900 text-white rounded-xl p-2.5 shadow border border-slate-700">
            <div class="flex items-center justify-between text-[11px] text-slate-300 mb-0.5">
                <span id="m-cur-location" class="text-sky-300 font-bold truncate">📍 1F売場 / 棚A-01 / 1段目</span>
                <span id="m-cur-status-badge" class="bg-slate-700 text-slate-200 px-1.5 py-0.2 rounded text-[10px]">未入力</span>
            </div>

            <!-- 商品名 ＆ 単位バッジ -->
            <div class="flex items-baseline justify-between gap-2">
                <h1 id="m-cur-name" class="text-base sm:text-lg font-bold text-white leading-tight truncate">
                    手巻おにぎり 紅しゃけ
                </h1>
                <span class="shrink-0 bg-amber-400 text-slate-950 font-extrabold text-xs px-2 py-0.5 rounded">
                    単位: <span id="m-cur-unit">個</span>
                </span>
            </div>

            <!-- 数量比較バー（この場所の前回 vs 今回入力 vs 追加累計） -->
            <div class="grid grid-cols-3 gap-1.5 mt-2">
                <div class="bg-slate-800 rounded-lg px-2 py-1 border border-slate-700">
                    <span class="text-[10px] text-slate-400 block">この棚の前回</span>
                    <div class="flex items-baseline gap-1">
                        <b id="m-cur-prev" class="text-lg font-mono text-slate-200">20</b>
                        <span class="text-[10px] text-slate-400" id="m-cur-unit-sub1">個</span>
                    </div>
                </div>

                <div class="bg-blue-950 rounded-lg px-2 py-1 border-2 border-blue-400">
                    <span id="m-input-mode-label" class="text-[10px] text-sky-300 font-bold block">今回実棚数</span>
                    <div class="flex items-baseline gap-1">
                        <b id="m-cur-actual" class="text-2xl font-mono text-amber-300">0</b>
                        <span class="text-[10px] text-sky-200" id="m-cur-unit-sub2">個</span>
                    </div>
                </div>

                <div class="bg-slate-800 rounded-lg px-2 py-1 border border-slate-700 flex flex-col justify-between">
                    <span class="text-[10px] text-slate-400 block">全場所合計 / 差異</span>
                    <div class="text-xs font-mono">
                        計:<b id="m-cur-total-all" class="text-emerald-300">20</b>
                        (<span id="m-cur-diff" class="text-rose-400">0</span>)
                    </div>
                    <button onclick="openAddFoundStockModal()" class="tap-btn bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-[10px] px-1.5 py-0.5 rounded text-center mt-0.5">
                        ＋後から追加分
                    </button>
                </div>
            </div>
        </div>

        <!-- ③ 上部〜中央：大型テンキー＆確定ボタン（iPhone SEのファーストビュー内） -->
        <div class="bg-white rounded-xl p-2 shadow-sm border border-slate-200 flex flex-col gap-1.5">
            <!-- クイック補助キー -->
            <div class="grid grid-cols-4 gap-1 text-xs font-bold">
                <button onclick="copyPrevQty()" class="tap-btn bg-sky-100 text-sky-900 border border-sky-300 py-1.5 rounded-lg">前回同数</button>
                <button onclick="adjustQty(1)" class="tap-btn bg-slate-100 text-slate-800 border border-slate-300 py-1.5 rounded-lg">+1</button>
                <button onclick="adjustQty(5)" class="tap-btn bg-slate-100 text-slate-800 border border-slate-300 py-1.5 rounded-lg">+5</button>
                <button onclick="adjustQty(10)" class="tap-btn bg-slate-100 text-slate-800 border border-slate-300 py-1.5 rounded-lg">+10</button>
            </div>

            <!-- 数字テンキー（高さを抑えて押しやすい設計） -->
            <div class="grid grid-cols-3 gap-1 text-lg font-bold">
                <button onclick="pressNumKey('7')"
